events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format newsroom '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" upstream="$upstream_addr"';

    access_log /var/log/nginx/access.log newsroom;
    error_log  /var/log/nginx/error.log warn;
    sendfile on;
    keepalive_timeout 65;

    # Round Robin es el algoritmo predeterminado de NGINX: alterna las
    # solicitudes entre las instancias disponibles del upstream.
    upstream newsroom_app {
        server app-1:3000 max_fails=2 fail_timeout=5s;
        server app-2:3000 max_fails=2 fail_timeout=5s;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;

        add_header X-Load-Balancer "nginx" always;

        location = /nginx-status {
            stub_status;
            access_log off;
            add_header Cache-Control "no-store" always;
        }

        # Ruta explícita para el catálogo de noticias.
        location /noticias {
            proxy_pass http://newsroom_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Load-Balancer "nginx";
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
        }

        # La portada, las API y los recursos restantes usan el mismo upstream.
        location / {
            proxy_pass http://newsroom_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Load-Balancer "nginx";
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
        }
    }
}
